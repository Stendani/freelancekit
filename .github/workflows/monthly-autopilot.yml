name: Monthly autopilot

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Sync tool registry
        env:
          AUTOPILOT_START: "2026-11-01T05:00:00Z"
        run: node scripts/sync-registry.mjs
      - name: Publish scheduled tools
        env:
          AUTOPILOT_START: "2026-11-01T05:00:00Z"
        run: node scripts/autopublish.mjs
      - name: Rebuild sitemap
        env:
          SITE_URL: "https://freelancekit-b1n.pages.dev"
        run: node scripts/generate-sitemap.mjs
      - name: Run full project tests
        run: node tests/verify.cjs && node tests/smoke.cjs
      - name: Commit changes when needed
        run: |
          git config user.name "FreelanceKit Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Autopilot: publish scheduled content"
            git push
          fi
